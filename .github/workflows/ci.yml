name: BarberFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: barberflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Restore, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore BarberFlow.sln

      - name: Build solution
        run: dotnet build BarberFlow.sln --configuration Release --no-restore

      - name: Run automated tests with coverage
        run: >-
          dotnet test BarberFlow.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=barberflow-tests.trx"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barberflow-test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Validate Docker image
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker build --tag barberflow:ci .
