services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: barberflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${BARBERFLOW_SA_PASSWORD:-BarberFlow!2026Demo}"
    ports:
      - "14333:1433"
    volumes:
      - barberflow_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$$MSSQL_SA_PASSWORD' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  barberflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barberflow-web
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BarberFlowDb;User Id=sa;Password=${BARBERFLOW_SA_PASSWORD:-BarberFlow!2026Demo};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Database__ApplyMigrationsOnStartup: "true"
      Docker__DisableHttpsRedirect: "true"
      SeedDemoData__Enabled: "true"
    ports:
      - "8080:8080"

volumes:
  barberflow_sql_data:
